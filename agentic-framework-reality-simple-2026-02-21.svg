<text x="960" y="730" text-anchor="end" fill="#1d4ed8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Arial,sans-serif" font-size="34" font-weight="800">40% (4/10)</text>
