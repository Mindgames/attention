<text x="960" y="560" text-anchor="end" fill="#1d4ed8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Arial,sans-serif" font-size="34" font-weight="800">70% (7/10)</text>
