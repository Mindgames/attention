<text x="80" y="186" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Arial,sans-serif" font-size="58" font-weight="800">of agentic AI</text>
<text x="80" y="236" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Roboto,Arial,sans-serif" font-size="25">Code review of 10 modern agent products</text>
