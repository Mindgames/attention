<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-label="Agentic Product Runtime Reality">
  <rect width="1600" height="950" fill="#f7f8fb"/>
  <rect x="70" y="130" width="1460" height="740" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="90" y="70" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#0f172a">Agentic Product Runtime Reality (Code Review Snapshot)</text>
  <text x="90" y="105" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155">Key distinction: capability does not equal default execution pattern.</text>

  <line x1="530" y1="180" x2="1420" y2="180" stroke="#e2e8f0"/>
  <line x1="530" y1="180" x2="530" y2="820" stroke="#e2e8f0"/>
  <line x1="708" y1="180" x2="708" y2="820" stroke="#e2e8f0"/>
  <line x1="886" y1="180" x2="886" y2="820" stroke="#e2e8f0"/>
  <line x1="1064" y1="180" x2="1064" y2="820" stroke="#e2e8f0"/>
  <line x1="1242" y1="180" x2="1242" y2="820" stroke="#e2e8f0"/>
  <line x1="1420" y1="180" x2="1420" y2="820" stroke="#e2e8f0"/>

  <text x="525" y="850" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#475569">0</text>
  <text x="698" y="850" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#475569">20</text>
  <text x="876" y="850" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#475569">40</text>
  <text x="1054" y="850" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#475569">60</text>
  <text x="1232" y="850" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#475569">80</text>
  <text x="1410" y="850" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#475569">100</text>

  <text x="90" y="255" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#0f172a">Tool-first runtime (single orchestrator + tools)</text>
  <rect x="530" y="220" width="890" height="48" rx="8" fill="#0f172a"/>
  <text x="1435" y="252" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#0f172a">100% (10/10)</text>

  <text x="90" y="365" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#0f172a">Has delegation/subtask capability</text>
  <rect x="530" y="330" width="623" height="48" rx="8" fill="#334155"/>
  <text x="1168" y="362" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#0f172a">70% (7/10)</text>

  <text x="90" y="475" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#0f172a">Parallel control patterns</text>
  <rect x="530" y="440" width="356" height="48" rx="8" fill="#64748b"/>
  <text x="901" y="472" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#0f172a">40% (4/10)</text>

  <text x="90" y="585" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#0f172a">Agent-as-tool composition</text>
  <rect x="530" y="550" width="178" height="48" rx="8" fill="#94a3b8"/>
  <text x="723" y="582" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#0f172a">20% (2/10)</text>

  <text x="90" y="695" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#0f172a">Default multi-agent swarm runtime (observed)</text>
  <rect x="530" y="660" width="10" height="48" rx="6" fill="#cbd5e1"/>
  <text x="555" y="692" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#0f172a">0% (0/10)</text>

  <text x="90" y="910" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#334155">Takeaway: Most systems are tool-first. Delegation exists, but default swarm-style multi-agent execution is uncommon.</text>
</svg>
